name: build impulse

on:
  push:
    branches: [ "master" ]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            podman \
            slirp4netns \
            uidmap \
            fuse3 \
            fuse-overlayfs \
            libfuse-dev \
            python3 python3-pip make

      - name: Configure Podman storage backend
        run: |
          mkdir -p ~/.config/containers
          cat <<EOF > ~/.config/containers/storage.conf
          [storage]
          driver = "overlay"
          runroot = "/tmp/podman-run"
          graphroot = "/tmp/podman"
          [storage.options]
          mount_program = "/usr/bin/fuse-overlayfs"
          EOF

      - name: Verify Podman + fuse-overlayfs
        run: |
          podman --version
          which fuse-overlayfs
          fuse-overlayfs --help

      - name: Build impulse inside Podman using fuse-overlayfs
        run: |
          podman run --rm \
            -v "$PWD":/src:Z \
            -w /src \
            ubuntu:24.04 \
            bash -lc "
              apt-get update &&
              apt-get install -y make python3 &&
              make
            "
