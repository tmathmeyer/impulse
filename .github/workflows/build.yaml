name: build impulse

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ matrix.python-version }}

      - name: Install fuse
        run: sudo apt-get install -y fuse3 fuse-overlayfs libfuse-dev

      - name: Install make
        run: sudo apt-get install make

      - name: Verify fuse-overlayfs
        run: which fuse-overlayfs && fuse-overlayfs --help

      - name: Build Impulse
        run: make

      - name: Set Up Sources For Testing
        run: make copy_srcs

      - name: Run Unit Tests
        run: cd impulse && ../GENERATED/BINARIES/impulse/impulse testsuite --fakeroot $(dirname $(pwd)) --github_actions
